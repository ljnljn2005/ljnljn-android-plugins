# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.android-packages"
name = "Android packages.xml 软件包清单"
version = "0.1.0"
protocol = 2
library = "ljnljn_android_packages"
memory = "512MiB"
permissions = []

[[analyzer]]
id = "packages"
name = "Android packages.xml 软件包清单"
scope = "files"
extensions = ["xml"]
mime_types = ["application/xml", "text/xml"]
trigger = "manual"
category = "android"
