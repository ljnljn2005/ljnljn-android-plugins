[package]
name = "ljnljn-android-packages"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LovelyCarve LPP v2 analyzer: Android packages.xml inventory (LPP v2 port of the v1 file analyzer)"
publish = false

[lib]
name = "ljnljn_android_packages"
crate-type = ["cdylib", "rlib"]

[dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk" }
# Strict event-based XML parsing (declaration, comments, namespace prefixes,
# self-closing tags, attribute escaping, tag pairing). Default features stay
# empty so no encoding/serde extras are pulled in.
quick-xml = "0.41"

[dev-dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk", features = ["testing"] }

[lints.rust]
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

[workspace]

[workspace.package]
license = "AGPL-3.0-only"
