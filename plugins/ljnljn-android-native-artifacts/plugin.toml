# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.android-native-artifacts"
name = "Android 原生工件"
version = "0.1.0"
protocol = 2
library = "ljnljn_android_native_artifacts"
memory = "512MiB"
permissions = ["file_materialize"]

[[analyzer]]
id = "android_sms"
name = "短信与 MMS（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_calls"
name = "通话记录（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_contacts"
name = "通讯录（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_chrome_history"
name = "Chrome 历史（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_whatsapp"
name = "WhatsApp 消息（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_media"
name = "媒体库（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_downloads"
name = "下载记录（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_cookies"
name = "浏览器 Cookies（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_autofill"
name = "浏览器自动填充（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_calendar"
name = "日历事件（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_keep_notes"
name = "Google Keep 便笺（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_maps_places"
name = "Google 地图地点（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_top_sites"
name = "浏览器常用站点（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_chrome_bookmarks"
name = "浏览器书签（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_accounts"
name = "账号同步配置（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_wifi"
name = "WiFi 配置（检材）"
scope = "evidence"
trigger = "manual"
category = "android"

[[analyzer]]
id = "android_selected_databases"
name = "Android 数据库（单文件）"
scope = "files"
trigger = "manual"
category = "android"
extensions = ["db", "sqlite"]

[[analyzer]]
id = "android_selected_xml"
name = "账号/WiFi XML（单文件）"
scope = "files"
trigger = "manual"
category = "android"
extensions = ["xml"]

[[analyzer]]
id = "android_selected_json"
name = "浏览器书签 JSON（单文件）"
scope = "files"
trigger = "manual"
category = "android"
extensions = ["json"]
