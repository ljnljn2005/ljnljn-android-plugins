# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.android-contacts2"
name = "Android contacts2.db 通话记录统计"
version = "0.1.0"
protocol = 2
library = "ljnljn_android_contacts2"
memory = "2GiB"
# file_materialize: rusqlite needs a filesystem path, so the SDK materializes
# one host-owned read-only copy and releases the lease when the run ends.
permissions = ["file_materialize"]

[[analyzer]]
id = "contacts2_calls"
name = "contacts2.db calls 表统计"
scope = "files"
extensions = ["db", "sqlite"]
mime_types = ["application/vnd.sqlite3", "application/x-sqlite3"]
trigger = "manual"
category = "android"
