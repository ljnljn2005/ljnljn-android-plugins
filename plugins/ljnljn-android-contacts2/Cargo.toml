[package]
name = "ljnljn-android-contacts2"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LovelyCarve LPP v2 analyzer: read-only Android contacts2.db calls table statistics"
publish = false

[lib]
name = "ljnljn_android_contacts2"
crate-type = ["cdylib", "rlib"]

[dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk" }
# bundled: SQLite is compiled into the plugin, so the target machine needs no
# sqlite3. The database is opened read-only through SQLITE_OPEN_READ_ONLY.
rusqlite = { version = "0.32.1", features = ["bundled"] }

[dev-dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk", features = ["testing"] }

[lints.rust]
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

[workspace]

[workspace.package]
license = "AGPL-3.0-only"
